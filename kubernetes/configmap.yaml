apiVersion: v1
kind: ConfigMap

metadata:
  name: smartdesk-config
  namespace: smartdesk

data:
  APP_NAME: "SmartDesk"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://smartdesk.local"

  DB_CONNECTION: "mysql"
  DB_HOST: "host.docker.internal"  
  DB_PORT: "3306"
  DB_DATABASE: "smartdesk"
  DB_USERNAME: "root"

  CACHE_DRIVER: "file"
  SESSION_DRIVER: "database"
  QUEUE_CONNECTION: "database"